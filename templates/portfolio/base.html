{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ profile.name|default:"Kavleen Kaur" }} - Python Django Developer{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One:wght@400&display=swap" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}

    <script>
    
            document.addEventListener('DOMContentLoaded', function () {
              // Smooth scrolling for anchor links
              document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                  e.preventDefault();
                  const target = document.querySelector(this.getAttribute('href'));
                  if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                    history.pushState(null, null, this.getAttribute('href'));
                  }
                });
              });
            
              // Contact form handler
              const contactForm = document.querySelector('#contact-form');
              if (contactForm) {
                contactForm.addEventListener('submit', function (e) {
                  e.preventDefault();
                  const formData = new FormData(this);
                  fetch('{% url "portfolio:send_message" %}', {
                    method: 'POST',
                    body: formData,
                    headers: {
                      'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    }
                  })
                  .then(response => response.json())
                  .then(data => {
                    if (data.success) {
                      alert(data.message);
                      contactForm.reset();
                    } else {
                      alert('Error: ' + (data.error || 'Please check your input'));
                    }
                  })
                  .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                  });
                });
              }
            });
            </script>
            
  
</body>
</html>
